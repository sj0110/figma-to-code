<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AI Code Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.2);
        }

        .success-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        .warning-btn {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .status.success {
            background: rgba(72, 187, 120, 0.3);
            border: 1px solid rgba(72, 187, 120, 0.5);
        }

        .status.error {
            background: rgba(245, 101, 101, 0.3);
            border: 1px solid rgba(245, 101, 101, 0.5);
        }

        .status.info {
            background: rgba(66, 153, 225, 0.3);
            border: 1px solid rgba(66, 153, 225, 0.5);
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .json-preview {
            max-height: 400px;
            overflow: auto;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre;
            color: #fff;
            line-height: 1.5;
        }

        .json-container {
            position: relative;
            margin-top: 10px;
            display: block;
            width: 100%;
        }

        .json-toolbar {
            position: absolute;
            top: 45px;
            right: 10px;
            display: flex;
            gap: 6px;
            z-index: 20;
        }

        .copy-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 4px;
            border: none;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
        }

        .copy-btn:hover {
            background: rgba(0, 0, 0, 0.75);
        }

        .json-container:hover .copy-btn {
            opacity: 1;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .step {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 5px;
            border-radius: 8px;
            font-size: 12px;
        }

        .step.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        .step.complete {
            background: rgba(72, 187, 120, 0.3);
        }

        .info-badge {
            display: inline-block;
            background: rgba(66, 153, 225, 0.3);
            border: 1px solid rgba(66, 153, 225, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }

        .framework-info {
            font-size: 12px;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.8);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab {
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
            color: rgba(255, 255, 255, 0.6);
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: #f093fb;
            color: #fff;
            font-weight: 600;
        }

        .success-message {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid rgba(72, 187, 120, 0.5);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .success-message h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #48bb78;
        }

        .success-message p {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .success-message a {
            color: #90cdf4;
            text-decoration: none;
            word-break: break-all;
        }

        .success-message a:hover {
            text-decoration: underline;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-buttons button {
            flex: 1;
        }

        .frame-count {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid rgba(72, 187, 120, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 AI Code Generator</h1>

        <div class="step-indicator">
            <div class="step" id="step1">1. Extract</div>
            <div class="step" id="step2">2. Process</div>
            <div class="step" id="step3">3. Generate</div>
            <div class="step" id="step4">4. Deploy</div>
        </div>

        <div class="card">
            <h2 style="font-size: 18px; margin-bottom: 15px;">Configuration</h2>

            <div class="input-group">
                <label>Target Framework</label>
                <select id="framework">
                    <option value="nextjs">Next.js 15 (App Router)</option>
                    <option value="react">React 19</option>
                    <option value="react-native">React Native (Latest)</option>
                    <option value="vue">Vue 3 (Composition API)</option>
                    <option value="angular">Angular 18</option>
                </select>
                <div class="framework-info" id="frameworkInfo">
                    Next.js 15 with App Router, TypeScript, and Tailwind CSS
                </div>
            </div>

            <div class="input-group">
                <label>Repository URL</label>
                <input type="text" id="repoUrl" placeholder="https://github.com/username/repo">
            </div>

            <div class="input-group">
                <label>GitHub Token</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxx">
            </div>

            <div class="input-group">
                <label>
                    Branch Name
                    <span class="info-badge">Optional</span>
                </label>
                <input type="text" id="branchName" placeholder="main (default)">
                <div class="framework-info">
                    Leave empty to use repository's default branch
                </div>
            </div>
        </div>

        <div class="card">
            <button id="extractBtn" onclick="extractDesign()">
                Extract Design Data
            </button>

            <button id="generateBtn" class="secondary-btn hidden" onclick="generateCode()">
                Generate Code with AI
            </button>

            <button id="commitBtn" class="secondary-btn hidden" onclick="commitToRepo()">
                Commit to Repository
            </button>

            <div id="successMessage" class="success-message hidden">
                <h3>✅ Successfully Committed!</h3>
                <p><strong>Commit:</strong> <a id="commitLink" href="#" target="_blank"></a></p>
                <p><strong>File:</strong> <a id="fileLink" href="#" target="_blank"></a></p>

                <div class="action-buttons" style="font-size: 14px;">
                    <button class="success-btn" style="font-size: 14px; padding: 10px;" onclick="processAnotherFrame()">
                        Process Another Frame
                    </button>
                    <button class="warning-btn" style="font-size: 14px; padding: 10px;" onclick="closePlugin()">
                        Close Plugin
                    </button>
                </div>
            </div>

            <div id="status" class="status hidden"></div>

            <div id="jsonContainer" class="json-container hidden">
                <div class="tabs">
                    <div id="tabJson" class="tab active" onclick="switchTab('json')">Design JSON</div>
                    <div id="tabCode" class="tab" style="display:none;" onclick="switchTab('code')">Generated Code</div>
                </div>

                <div class="json-toolbar">
                    <button class="copy-btn" onclick="copyCurrentContent()" title="Copy">📋</button>
                </div>

                <div id="contentPreview" class="json-preview"></div>
            </div>
        </div>
    </div>

    <script>
        let extractedData = null;
        let generatedCode = null;
        let API_URL = null;
        let currentView = 'json';
        let processedFramesCount = 0;

        const frameworkDescriptions = {
            'nextjs': 'Next.js 15 with App Router, TypeScript, and Tailwind CSS',
            'react': 'React 19 with TypeScript and modern hooks',
            'react-native': 'React Native with TypeScript and Expo support',
            'vue': 'Vue 3 with Composition API and TypeScript',
            'angular': 'Angular 18 with standalone components'
        };

        window.addEventListener('load', () => {
            parent.postMessage({ pluginMessage: { type: 'get-api-url' } }, '*');

            document.getElementById('framework').addEventListener('change', (e) => {
                const info = frameworkDescriptions[e.target.value] || '';
                document.getElementById('frameworkInfo').textContent = info;
            });
        });

        function updateStep(stepNum) {
            for (let i = 1; i <= 4; i++) {
                const step = document.getElementById(`step${i}`);
                step.classList.remove('active', 'complete');
                if (i < stepNum) step.classList.add('complete');
                if (i === stepNum) step.classList.add('active');
            }
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
        }

        function hideStatus() {
            const status = document.getElementById('status');
            status.classList.add('hidden');
        }

        function switchTab(view) {
            currentView = view;
            const tabJson = document.getElementById('tabJson');
            const tabCode = document.getElementById('tabCode');
            const preview = document.getElementById('contentPreview');
            if (!preview) return;
            if (tabJson) tabJson.classList.toggle('active', view === 'json');
            if (tabCode) tabCode.classList.toggle('active', view === 'code');

            if (view === 'json') {
                preview.innerHTML = beautifyJson(extractedData);
            } else {
                preview.innerHTML = simpleHighlight(generatedCode);
            }
        }

        function simpleHighlight(code) {
            if (!code) return "No code generated yet...";

            const escapedCode = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            return escapedCode;
        }

        function copyCurrentContent() {
            const textToCopy = currentView === 'json'
                ? JSON.stringify(extractedData, null, 2)
                : generatedCode;

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showStatus('Copied to clipboard!', 'success');
            setTimeout(hideStatus, 2000);
        }

        function extractDesign() {
            updateStep(1);
            showStatus('Extracting design data...', 'info');

            const btn = document.getElementById('extractBtn');
            btn.disabled = true;
            btn.innerHTML = 'Extracting...<span class="loading"></span>';

            parent.postMessage({ pluginMessage: { type: 'extract-design' } }, '*');
        }

        function beautifyJson(obj) {
            const json = JSON.stringify(obj, null, 2);

            return json
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
        }

        async function generateCode() {
            if (!API_URL) {
                showStatus('Backend URL not configured', 'error');
                return;
            }

            updateStep(3);
            showStatus('Generating code with AI...', 'info');

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = 'Generating...<span class="loading"></span>';

            const apiUrl = API_URL.replace(/\/$/, '');
            const framework = document.getElementById('framework').value;
            const repoUrl = document.getElementById('repoUrl').value;

            try {
                const response = await fetch(`${apiUrl}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        designData: extractedData,
                        framework: framework,
                        repoUrl: repoUrl || null
                    }),
                });

                const result = await response.json();

                if (result.success) {
                    generatedCode = result.code;
                    showStatus('Code generated successfully!', 'success');
                    document.getElementById('commitBtn').classList.remove('hidden');
                    document.getElementById('tabCode').style.display = 'block';
                    switchTab('code');
                    updateStep(4);
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                showStatus(`Generation failed: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Generate Code with AI';
            }
        }

        async function commitToRepo() {
            if (!API_URL) {
                showStatus('Backend URL not configured', 'error');
                return;
            }

            showStatus('Committing to repository...', 'info');

            const btn = document.getElementById('commitBtn');
            btn.disabled = true;
            btn.innerHTML = 'Committing...<span class="loading"></span>';

            const apiUrl = API_URL.replace(/\/$/, '');
            const repoUrl = document.getElementById('repoUrl').value;
            const githubToken = document.getElementById('githubToken').value;
            const branchName = document.getElementById('branchName').value || null;

            try {
                const response = await fetch(`${apiUrl}/api/commit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: generatedCode,
                        repoUrl: repoUrl,
                        githubToken: githubToken,
                        frameName: extractedData.metadata.frameName,
                        branchName: branchName
                    }),
                });

                const result = await response.json();

                if (result.success) {
                    processedFramesCount++;

                    // Hide status and show success message
                    hideStatus();

                    const successMsg = document.getElementById('successMessage');
                    const commitLink = document.getElementById('commitLink');
                    const fileLink = document.getElementById('fileLink');

                    commitLink.href = result.commitUrl;
                    commitLink.textContent = result.commitHash.substring(0, 7);

                    fileLink.href = result.fileUrl;
                    fileLink.textContent = result.filePath;

                    successMsg.classList.remove('hidden');

                    // Hide commit button
                    btn.classList.add('hidden');

                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                showStatus(`Commit failed: ${error.message}`, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Commit to Repository';
            }
        }

        function processAnotherFrame() {
            // Reset the UI for another frame
            extractedData = null;
            generatedCode = null;

            // Hide success message
            document.getElementById('successMessage').classList.add('hidden');

            // Reset buttons
            document.getElementById('generateBtn').classList.add('hidden');
            document.getElementById('commitBtn').classList.add('hidden');
            document.getElementById('commitBtn').disabled = false;
            document.getElementById('commitBtn').innerHTML = 'Commit to Repository';

            // Hide JSON container and tabs
            document.getElementById('jsonContainer').classList.add('hidden');
            document.getElementById('tabCode').style.display = 'none';

            // Reset steps
            updateStep(1);

            // Re-enable extract button
            const extractBtn = document.getElementById('extractBtn');
            extractBtn.disabled = false;
            extractBtn.innerHTML = 'Extract Design Data';

            // Show instruction message
            showStatus(`Ready to process frame #${processedFramesCount + 1}. Select a frame and click Extract.`, 'info');

            // Scroll to top
            window.scrollTo(0, 0);
        }

        function closePlugin() {
            parent.postMessage({ pluginMessage: { type: 'close-plugin' } }, '*');
        }

        window.onmessage = async (event) => {
            const msg = event.data.pluginMessage;

            if (msg.type === 'api-url') {
                API_URL = msg.url;
            }

            if (msg.type === 'design-extracted') {
                if (!API_URL) {
                    showStatus('Backend URL not configured', 'error');
                    document.getElementById('extractBtn').disabled = false;
                    document.getElementById('extractBtn').innerHTML = 'Extract Design Data';
                    return;
                }
                extractedData = msg.data;
                showStatus('Saving to database...', 'info');
                const apiUrl = API_URL.replace(/\/$/, '');

                try {
                    const response = await fetch(`${apiUrl}/api/extract`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            designData: extractedData,
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`Server responded with ${response.status}`);
                    }

                    showStatus('Design extracted successfully!', 'success');
                    updateStep(2);

                    const container = document.getElementById('jsonContainer');
                    const preview = document.getElementById('contentPreview');
                    if (container) {
                        container.classList.remove('hidden');
                        container.style.display = 'block';
                        preview.innerHTML = beautifyJson(extractedData);
                        switchTab('json');
                    }

                    document.getElementById('generateBtn').classList.remove('hidden');
                } catch (error) {
                    showStatus('Database error: ' + error.message, 'error');
                    console.error('Fetch Error:', error);
                }
                finally {
                    document.getElementById('extractBtn').disabled = false;
                    document.getElementById('extractBtn').innerHTML = 'Extract Design Data';
                }
            }

            if (msg.type === 'error') {
                showStatus(msg.message, 'error');
                document.getElementById('extractBtn').disabled = false;
                document.getElementById('extractBtn').innerHTML = 'Extract Design Data';
            }
        };
    </script>
</body>

</html>
